---
#
# Ansible managed
#

name: Ansible Molecule

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:
  schedule:
    - cron: '1 1 1 * *'

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout
        uses: actions/checkout@v5
      - name: ansible-lint
        uses: ansible/ansible-lint@v25.9.2

  molecule:
    needs:
      - lint
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        distro:
          - image: "amazonlinux"
            tag: "latest"
    steps:
      - name: checkout
        uses: actions/checkout@v5
        with:
          path: ansible-role-at

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Configure Docker for systemd
        run: |
          sudo mkdir -p /etc/docker
          echo '{
            "features": {
              "buildkit": true
            },
            "exec-opts": ["native.cgroupdriver=systemd"]
          }' | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker || true

      - name: Install Docker
        uses: docker/setup-buildx-action@v4

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip3 install ansible molecule molecule-plugins[docker] docker

      - name: Debug amazonlinux sudo
        run: |
          set +e
          ls -l /etc/apparmor.d/ | grep -i chkpwd; aa-status 2>&1 | grep -i chkpwd
          echo "=== A: security-opt apparmor=unconfined"
          docker run -d --name ctra --privileged --security-opt apparmor=unconfined --cgroupns host -v /sys/fs/cgroup:/sys/fs/cgroup:rw robertdebock/amazonlinux:latest /sbin/init; sleep 4
          docker exec ctra bash -c 'dnf -y -q install sudo >/dev/null; sudo -n true; echo A-rc=$?'
          docker rm -f ctra >/dev/null
          echo "=== D: disable host profile unix-chkpwd"
          sudo ln -sf /etc/apparmor.d/unix-chkpwd /etc/apparmor.d/disable/ 2>&1; sudo apparmor_parser -R /etc/apparmor.d/unix-chkpwd 2>&1; aa-status 2>&1 | grep -ci chkpwd
          docker run -d --name ctrd --privileged --cgroupns host -v /sys/fs/cgroup:/sys/fs/cgroup:rw robertdebock/amazonlinux:latest /sbin/init; sleep 4
          docker exec ctrd bash -c 'dnf -y -q install sudo >/dev/null; sudo -n true; echo D-rc=$?'
          docker rm -f ctrd >/dev/null
      - name: Test with molecule
        run: |
          cd ansible-role-at
          molecule test
        env:
          PY_COLORS: 1
          ANSIBLE_FORCE_COLOR: 1
          ANSIBLE_ROLES_PATH: ~/.ansible/roles:${GITHUB_WORKSPACE}/ansible-role-at
          image: ${{ matrix.distro.image }}
          tag: ${{ matrix.distro.tag }}
