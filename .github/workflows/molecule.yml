---
#
# Ansible managed
#

name: Ansible Molecule

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:
  schedule:
    - cron: '1 1 1 * *'

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout
        uses: actions/checkout@v5
      - name: ansible-lint
        uses: ansible/ansible-lint@v25.9.2

  molecule:
    needs:
      - lint
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        distro:
          - image: "amazonlinux"
            tag: "latest"
    steps:
      - name: checkout
        uses: actions/checkout@v5
        with:
          path: ansible-role-at

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Configure Docker for systemd
        run: |
          sudo mkdir -p /etc/docker
          echo '{
            "features": {
              "buildkit": true
            },
            "exec-opts": ["native.cgroupdriver=systemd"]
          }' | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker || true

      - name: Install Docker
        uses: docker/setup-buildx-action@v4

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip3 install ansible molecule molecule-plugins[docker] docker

      - name: Debug amazonlinux sudo
        run: |
          set +e
          uname -r; docker version --format '{{.Server.Version}} {{.Server.Os}}/{{.Server.Arch}}'; docker info | grep -iE "cgroup|storage|security"
          docker run -d --name amzn --privileged --cgroupns host -v /sys/fs/cgroup:/sys/fs/cgroup:rw robertdebock/amazonlinux:latest /sbin/init
          sleep 5
          docker exec amzn bash -c 'cat /etc/os-release | head -2; date; chage -l root; getent shadow root | cut -d: -f1-9; rpm -q sudo shadow-utils; dnf -y -q install sudo; ls -l /usr/bin/sudo; sudo -n true; echo sudo-rc=$?; cat /etc/pam.d/sudo; ls /etc/pam.d | head -30'
          docker exec amzn bash -c 'sudo -n -u root id; echo rc=$?; grep -i sudo /var/log/secure 2>/dev/null | tail -3; journalctl -n 5 --no-pager 2>/dev/null | tail -5'
          docker rm -f amzn
      - name: Test with molecule
        run: |
          cd ansible-role-at
          molecule test
        env:
          PY_COLORS: 1
          ANSIBLE_FORCE_COLOR: 1
          ANSIBLE_ROLES_PATH: ~/.ansible/roles:${GITHUB_WORKSPACE}/ansible-role-at
          image: ${{ matrix.distro.image }}
          tag: ${{ matrix.distro.tag }}
