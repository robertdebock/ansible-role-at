---
# EXPERIMENT: run molecule on GitLab's shared (instance) Linux amd64 runners with Docker-in-Docker.

variables:
  DEBIAN_FRONTEND: noninteractive
  DOCKER_HOST: tcp://docker:2375
  DOCKER_TLS_CERTDIR: ""

molecule:
  image: python:3.13
  services:
    - docker:dind
  script:
    - python -m pip install --upgrade pip
    - pip3 install ansible molecule molecule-plugins[docker] docker
    - pip3 install --upgrade "ansible-core>=2.22"
    - uname -m
    - molecule test
  rules:
    - if: $CI_COMMIT_REF_NAME == "experiment/shared-runner"
  parallel:
    matrix:
      - image: "debian"
        tag: "latest"
      - image: "fedora"
        tag: "latest"
      - image: "alpine"
        tag: "latest"
